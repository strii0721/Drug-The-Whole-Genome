name: drugclip
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8
  - faiss-gpu=1.8.0
  - pip:
    - -r docker/requirements.txt
    - iopath
    - lmdb
    - ml_collections
    - tensorboardX
    - tqdm
    - tokenizers
    - typing-extensions>=4.15.0
